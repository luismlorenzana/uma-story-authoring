name: CI
on:
  push:
    branches: [feat/initial-preview]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: node check-private.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
